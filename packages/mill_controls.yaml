# Controls: the Mill Button turns the whole mill on and off, reverses the
# turning sails and leaves disco, with no network.
# Needs substitution: button_pin (button to ground, no external pull-up).
# Exposes ids: mill_button (binary sensor "Mill Button"),
#   mill_toggle (script), mill_on (script), mill_off (script),
#   mill_reverse_from_button (script).
# Uses ids: mill_sails_turn and mill_sails_reverse_switch (switch "Reverse
#   Rotation") from the sails package; mill_door_glow, mill_stone_window,
#   mill_bin_window, mill_door_lamp and mill_lamplight (script) from the lights
#   package; mill_disco_mode (switch "Disco Mode") from the disco package.
#   The scripts use only these firmware entities, turn on no light
#   themselves and never touch the strip. Only the long
#   press changes the sail direction, and only through the Reverse Rotation
#   switch, never through the direction global.
# In disco, a short press turns the mill off as it does outside disco, and the
# disco check then turns "Disco Mode" off. A long press turns "Disco Mode" off,
# so the lights take the lamplight look and the sails keep their direction.
# The button never starts disco.

binary_sensor:
  - platform: gpio
    name: Mill Button
    id: mill_button
    pin:
      number: ${button_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    # The only handler. A press of 50-500 ms toggles the mill. A press of
    # 1-5 s leaves disco while "Disco Mode" is on, else reverses the turning
    # sails. Each acts on release. Any other press does nothing.
    on_click:
      - min_length: 50ms
        max_length: 500ms
        then:
          - script.execute: mill_toggle
      - min_length: 1s
        max_length: 5s
        then:
          - if:
              condition:
                switch.is_on: mill_disco_mode
              then:
                - switch.turn_off: mill_disco_mode
                - logger.log:
                    format: "Button: disco off"
                    level: INFO
                    tag: mill.controls
              else:
                - script.execute: mill_reverse_from_button

script:
  # Off if the sails turn or any light is on, else on.
  - id: mill_toggle
    then:
      - if:
          condition:
            or:
              - switch.is_on: mill_sails_turn
              - light.is_on: mill_door_glow
              - light.is_on: mill_stone_window
              - light.is_on: mill_bin_window
              - light.is_on: mill_door_lamp
          then:
            - script.execute: mill_off
            - logger.log:
                format: "Button: mill off"
                level: INFO
                tag: mill.controls
          else:
            - script.execute: mill_on
            - logger.log:
                format: "Button: mill on"
                level: INFO
                tag: mill.controls

  # Reverse the sails while they turn. The Reverse Rotation switch does the
  # reversal, so HA shows the change, and the sails tick slows the sails to a
  # stop, then turns them the other way. While the sails are stopped, do
  # nothing.
  - id: mill_reverse_from_button
    then:
      - if:
          condition:
            switch.is_on: mill_sails_turn
          then:
            - switch.toggle: mill_sails_reverse_switch
            - logger.log:
                format: "Button: sails reversed"
                level: INFO
                tag: mill.controls

  # Stop the sails: they spin down over about 3 s. Each light fades off over
  # its 3 s default and stops its effect. Stop any pending lamplight first, so no light comes back
  # on with Lamplight.
  - id: mill_off
    then:
      - script.stop: mill_on
      - script.stop: mill_lamplight
      - switch.turn_off: mill_sails_turn
      - light.turn_off: mill_door_glow
      - light.turn_off: mill_stone_window
      - light.turn_off: mill_bin_window
      - light.turn_off: mill_door_lamp

  # Start the sails at the current Sail Speed and give all four lights the
  # lamplight look.
  - id: mill_on
    mode: restart
    then:
      - switch.turn_on: mill_sails_turn
      - script.execute:
          id: mill_lamplight
          mask: 15
