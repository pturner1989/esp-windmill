# The node config, with no secrets, so the ESPHome dashboard in HA can pull it
# from GitHub. local.yaml adds the secrets for a build from this repo, and the
# config the dashboard writes on adoption adds its own.
substitutions:
  name: village-windmill
  friendly_name: Windmill
  # Stepper IN1 to IN4. GPIO2 is a boot-strapping pin and stays unconnected.
  sails_pin_a: GPIO0
  sails_pin_b: GPIO1
  sails_pin_c: GPIO3
  sails_pin_d: GPIO4
  # "1" or "-1". Set on the bench so forward is anticlockwise from the sail side.
  sails_forward_direction: "1"
  # Pixel data, through the 330R resistor.
  pixel_pin: GPIO6
  # Mill Button to ground. The internal pull-up holds it high.
  button_pin: GPIO5

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # The ESPHome dashboard needs this to adopt the node.
  project:
    name: pturner1989.esp-windmill
    version: "1.0"
  # The disco maths and its glue, used by the "Disco" light effects, and the
  # sails maths, used by the sails tick. A package cannot hold this node-level
  # key, so the hub must copy it too.
  includes:
    - include/mill_disco.h
    - include/mill_disco_esphome.h
    - include/mill_ramp.h
    - include/mill_ramp_esphome.h

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
    # ESP-IDF prints early lines straight to the USB console, past the logger.
    log_level: NONE

logger:
  baud_rate: 0
  level: INFO

# The node never restarts itself when HA or WiFi is gone, so the mill keeps
# its state through the loss. Both connections retry on their own.
api:
  reboot_timeout: 0s

# local.yaml adds the password with "id: !extend mill_ota".
ota:
  - platform: esphome
    id: mill_ota

wifi:
  reboot_timeout: 0s
  ap:
    ssid: Windmill Fallback

captive_portal:

# Lets the ESPHome dashboard in HA adopt the node and build it from this file
# on GitHub.
dashboard_import:
  package_import_url: github://pturner1989/esp-windmill/windmill.yaml@main

packages:
  sails: !include packages/mill_sails.yaml
  lights: !include packages/mill_lights.yaml
  controls: !include packages/mill_controls.yaml
  disco: !include packages/mill_disco.yaml
